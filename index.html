<style>
/* Tela de carregamento: fica aqui (e não num .css) pra aparecer antes de tudo. */
#carregando {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: radial-gradient(70% 55% at 50% 40%, rgba(47, 95, 208, .22), transparent 70%),
              radial-gradient(60% 50% at 50% 100%, rgba(229, 57, 46, .12), transparent 70%), #12161c;
  color: #eef1f4; font-family: 'Inter', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s;
}
#carregando.saindo { opacity: 0; visibility: hidden; pointer-events: none; }
#carregando::before, #carregando::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 12px; opacity: .22;
  background: conic-gradient(#f3e9d2 25%, transparent 0 50%, #f3e9d2 0 75%, transparent 0) 0 0 / 12px 12px;
  animation: ld-xadrez 1.2s linear infinite;
}
#carregando::after { top: auto; bottom: 0; opacity: .14; animation-direction: reverse; }
.ld-centro { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(380px, 86vw); text-align: center; }
.ld-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #e5392e; }
.ld-titulo { font-family: 'Alfa Slab One', Georgia, serif; font-size: clamp(44px, 13vw, 72px); line-height: 1; letter-spacing: 1px; color: #f3e9d2; margin-top: -6px; text-shadow: 3px 3px 0 rgba(229, 57, 46, .55); }
.ld-pista { position: relative; width: 100%; height: 78px; margin-top: 12px; }
.ld-asfalto {
  position: absolute; left: 0; right: 38px; bottom: 10px; height: 18px; border-radius: 999px; overflow: hidden;
  background: #0b0f14; box-shadow: inset 0 0 0 1px #2c343f;
}
.ld-asfalto::after {
  content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px;
  background: repeating-linear-gradient(90deg, rgba(243, 233, 210, .55) 0 14px, transparent 14px 28px);
  animation: ld-faixas .35s linear infinite;
}
.ld-rastro {
  position: absolute; left: 0; bottom: 10px; height: 18px; border-radius: 999px;
  background: linear-gradient(90deg, rgba(47, 95, 208, 0), #2f5fd0 55%, #e5392e);
  animation: ld-volta 2.2s cubic-bezier(.55, .05, .35, 1) infinite;
}
.ld-capacete { position: absolute; bottom: 18px; left: 0; width: 84px; height: 58px; animation: ld-capacete 2.2s cubic-bezier(.55, .05, .35, 1) infinite; }
.ld-capacete svg { width: 100%; height: 100%; animation: ld-tremor .18s ease-in-out infinite alternate; }
.ld-capacete::before, .ld-capacete::after { content: ""; position: absolute; right: 100%; border-radius: 999px; background: rgba(243, 233, 210, .5); }
.ld-capacete::before { bottom: 16px; width: 56px; height: 6px; margin-right: -26px; }
.ld-capacete::after { bottom: 28px; width: 40px; height: 4px; margin-right: -16px; background: rgba(243, 233, 210, .3); }
.ld-bandeira { position: absolute; right: 0; bottom: 6px; width: 36px; height: 36px; border-radius: 8px; background: conic-gradient(#f3e9d2 25%, #12161c 0 50%, #f3e9d2 0 75%, #12161c 0) 0 0 / 18px 18px; box-shadow: 0 0 0 2px #f3e9d2; }
.ld-frases { position: relative; height: 20px; width: 100%; font-size: 14px; color: #b4bdc8; }
.ld-frases span { position: absolute; inset: 0; opacity: 0; animation: ld-frase 6.6s infinite; }
.ld-frases span:nth-child(2) { animation-delay: 2.2s; }
.ld-frases span:nth-child(3) { animation-delay: 4.4s; }
@keyframes ld-xadrez { to { background-position: 24px 0; } }
@keyframes ld-faixas { to { transform: translateX(-28px); } }
@keyframes ld-volta { 0% { width: 0; opacity: 0; } 10% { opacity: 1; } 85% { width: calc(100% - 38px); opacity: 1; } 100% { width: calc(100% - 38px); opacity: 0; } }
@keyframes ld-capacete { 0% { transform: translateX(-20px); opacity: 0; } 10% { opacity: 1; } 85% { transform: translateX(calc(min(380px, 86vw) - 124px)); opacity: 1; } 100% { transform: translateX(calc(min(380px, 86vw) - 124px)); opacity: 0; } }
@keyframes ld-tremor { to { transform: translateY(-1.5px) rotate(-1.5deg); } }
@keyframes ld-frase { 0% { opacity: 0; transform: translateY(6px); } 5%, 30% { opacity: 1; transform: none; } 36%, 100% { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  #carregando *, #carregando::before, #carregando::after { animation: none !important; }
  .ld-rastro { width: 60%; }
  .ld-capacete { transform: translateX(calc(min(380px, 86vw) * .6 - 84px)); }
  .ld-frases span:first-child { opacity: 1; }
}
</style>

<body>

    <span class="ld-eyebrow">Juventude Box</span>
    <span class="ld-titulo">CHAMADA</span>
    <div class="ld-pista" aria-hidden="true">
      <div class="ld-asfalto"></div>
      <div class="ld-rastro"></div>
      <div class="ld-capacete"><svg viewBox="0 0 64 44">
        <path d="M18 21.5C10 20 5 16.5 2.5 11.5c6 2 11 3 16 5.5z" fill="#f3e9d2"/>
        <path d="M17.5 27C9.5 27.5 4 25 1 21c6 1 11 1.2 17 3z" fill="#f3e9d2"/>
        <path d="M17.5 32.5c-7 1.2-12 0-15-3 6 .3 10.5 0 15.5 0z" fill="#f3e9d2"/>
        <path d="M16 38C14.5 20.5 24.5 8 40.5 8 53.5 8 61.5 18 61.5 30v8z" fill="#2f5fd0"/>
        <path d="M46.5 25h15v13h-10.5c-2.8 0-4.5-2-4.5-4.7z" fill="#12161c"/>
        <path d="M44.5 23.5h15.5" stroke="#f3e9d2" stroke-width="3" stroke-linecap="round"/>
        <path d="M23 20.5c3.5-6.5 10-10 18.5-10" stroke="#e5392e" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <rect x="14.5" y="36" width="49" height="5" rx="2.5" fill="#e5392e"/>
      </svg></div>
      <span class="ld-bandeira"></span>
    </div>
    <div class="ld-frases"><span>Ligando os motores…</span><span>Conferindo a lista…</span><span>Quase na largada…</span></div>
  </div>
</div>
